name: Check and publish constant-width problems

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Set up Node.js for equation rendering
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate data and review tracking
        run: |
          python scripts/validate.py
          python scripts/review_status.py
          python scripts/review_status.py --self-test
          python scripts/check_workflow.py
      - name: Check mathematical formulas and constructions
        run: |
          python scripts/check_formulas.py
          python scripts/check_mixed_volume.py
          python scripts/check_packing.py
          python scripts/check_topologies.py
          python scripts/check_blaschke_routes.py
      - name: Build and check the offline reader
        run: |
          python scripts/build_html.py
          python scripts/check_html.py
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload the reader
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the reader
        id: deployment
        uses: actions/deploy-pages@v4
